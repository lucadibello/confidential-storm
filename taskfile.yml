version: "3"

vars:
  WORKSPACE: .
  SESSION: dev
  CONTAINER_NAME: confidential-storm-devcontainer
  TUNNEL_SRV: sws01
  TUNNEL_USER: luca
  SSH_TUNNEL_REMOTE_PORT: 2222
  SSH_TUNNEL_LOCAL_PORT: 8022
  STORM_UI_REMOTE_PORT: 9090
  STORM_UI_LOCAL_PORT: 9090
  STORM_NETWORK: storm-net
  REMOTE_UID:
    sh: id -u
  REMOTE_GID:
    sh: id -g
  # Real SGX host -> SGX config; anything else (e.g. Apple Silicon) -> amd64-emulated, no-SGX config.
  # Override with: task devcontainer CONFIG=.devcontainer/devcontainer.json
  CONFIG:
    sh: '[ -e /dev/sgx_enclave ] && echo .devcontainer/devcontainer.json || echo .devcontainer/emulated/devcontainer.json'
  DC_ARGS: --workspace-folder {{.WORKSPACE}} --config {{.CONFIG}}

tasks:
  devcontainer:
    desc: Build, start, and attach to the devcontainer
    cmds:
      - task: devcontainer-build
      - task: devcontainer-up
      - task: devcontainer-attach

  devcontainer-recreate:
    desc: Recreates a devcontainer from scratch to ensure a clean environment
    cmds:
      - task: devcontainer-down
      - task: devcontainer

  ensure-network:
    desc: Create the Docker network required by the devcontainer (idempotent)
    internal: true
    cmds:
      - docker network create {{.STORM_NETWORK}} 2>/dev/null || true

  ensure-amd64-emulation:
    desc: Register QEMU binfmt handlers so Docker can run linux/amd64 images (idempotent)
    internal: true
    status:
      - '[ -e /dev/sgx_enclave ] || docker run --rm --platform linux/amd64 alpine uname -m | grep -qx x86_64'
    cmds:
      - docker run --privileged --rm tonistiigi/binfmt --install amd64

  devcontainer-build:
    desc: Build the devcontainer image for this workspace
    preconditions:
      - sh: test -f .env
        msg: ".env file not found — copy .env.example and fill in your secrets"
      - sh: test -S "$SSH_AUTH_SOCK"
        msg: "SSH_AUTH_SOCK is not set or does not point to a valid socket"
    env:
      REMOTE_UID: "{{.REMOTE_UID}}"
      REMOTE_GID: "{{.REMOTE_GID}}"
    cmds:
      - task: ensure-amd64-emulation
      - devcontainer build {{.DC_ARGS}}

  devcontainer-up:
    desc: Start (or reuse) the devcontainer for this workspace
    deps: [ensure-network]
    preconditions:
      # Older CLIs miss Docker 29's start event (`Action` field) and hang after `docker run`.
      - sh: printf '0.80.3\n%s\n' "$(devcontainer --version)" | sort -V -C
        msg: "devcontainer CLI >= 0.80.3 required: npm i -g @devcontainers/cli@latest"
      - sh: test -f .env
        msg: ".env file not found — copy .env.example and fill in your secrets"
      - sh: test -S "$SSH_AUTH_SOCK"
        msg: "SSH_AUTH_SOCK is not set or does not point to a valid socket"
    env:
      REMOTE_UID: "{{.REMOTE_UID}}"
      REMOTE_GID: "{{.REMOTE_GID}}"
    cmds:
      - devcontainer up {{.DC_ARGS}}

  devcontainer-attach:
    desc: Exec into the devcontainer and start a bash shell
    preconditions:
      - sh: test -S "$SSH_AUTH_SOCK"
        msg: "SSH_AUTH_SOCK is not set or does not point to a valid socket"
    cmds:
      - devcontainer exec {{.DC_ARGS}} bash

  devcontainer-attach-tmux:
    desc: Exec into the devcontainer and start/attach tmux
    preconditions:
      - sh: test -S "$SSH_AUTH_SOCK"
        msg: "SSH_AUTH_SOCK is not set or does not point to a valid socket"
    cmds:
      - devcontainer exec {{.DC_ARGS}} tmux new-session -A -s {{.SESSION}}

  devcontainer-down:
    desc: Stop and remove the devcontainer for this workspace
    cmds:
      - docker stop {{.CONTAINER_NAME}} || true
      - docker rm -f -v {{.CONTAINER_NAME}} || true

  tunnel-ssh:
    desc: Expose the devcontainer’s SSH port locally so you can connect via SSH without extra steps
    cmds:
      - ssh -N -L {{.SSH_TUNNEL_LOCAL_PORT}}:127.0.0.1:{{.SSH_TUNNEL_REMOTE_PORT}} {{.TUNNEL_USER}}@{{.TUNNEL_SRV}}

  tunnel-storm-ui:
    desc: Forward the Storm web UI port from the remote server to your local machine
    cmds:
      - ssh -N -L {{.STORM_UI_LOCAL_PORT}}:127.0.0.1:{{.STORM_UI_REMOTE_PORT}} {{.TUNNEL_USER}}@{{.TUNNEL_SRV}}
